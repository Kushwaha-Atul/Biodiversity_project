<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StateSymbols-India</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Syne:wght@600;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div id="map" role="application" aria-label="Interactive map of India"></div>

<div class="hud">
  <div class="topbar" id="topbar">
    <div class="controls">
      <button class="btn" id="btnReset" disabled>Reset View</button>
      <button class="btn" id="btnReplay" disabled>Replay</button>
      <button class="btn" id="btnPitch" disabled>3D Tilt</button>
    </div>
  </div>
  <div class="intro" id="intro">
    <h2 id="introTitle" aria-label="India"></h2>
    <i></i>
    <p><strong>Biodiversity symbols and its status</strong></p>
  </div>
</div>

<div class="tip" id="tip"></div>
<div id="dash"><div class="dwin">
  <div class="side"><b>STATES &amp; UTs</b><input id="sq" placeholder="Search…"/><div id="sl"></div></div>
  <div class="main">
    <div class="dh"><h2 id="dt"></h2><button class="dx" id="dx" aria-label="Close">×</button></div>
    <div class="sum"><span>Forest Cover: <b id="fc">–</b></span><span>Threatened symbols: <b id="th">–</b> / 4</span><span style="margin-left:auto"><small id="stg" style="color:#6b7c76;margin-right:10px"></small><button class="dbtn g" id="exp">Export data</button><button class="dbtn g" id="imp">Import data</button><input type="file" id="impf" accept=".json" hidden></span><div class="bar"><i id="fb"></i></div></div>
    <div class="cards" id="cards"></div>
    <div id="det"></div>
  </div>
</div></div>


<script src="./script.js" defer></script>
</body>
</html>
